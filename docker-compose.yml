services:
  app:
    build:
      context: .
      target: production
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: "${APP_NAME:-Project Documentor}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DOCKER_DB_DATABASE:-laravel}"
      DB_USERNAME: "${DOCKER_DB_USERNAME:-laravel}"
      DB_PASSWORD: "${DOCKER_DB_PASSWORD:-secret}"
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    # Uncomment to expose MySQL on the host (default host port 3307):
    # ports:
    #   - "${MYSQL_HOST_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: "${DOCKER_DB_DATABASE:-laravel}"
      MYSQL_USER: "${DOCKER_DB_USERNAME:-laravel}"
      MYSQL_PASSWORD: "${DOCKER_DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DOCKER_DB_ROOT_PASSWORD:-rootsecret}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:
  app_storage:
  app_bootstrap_cache:
